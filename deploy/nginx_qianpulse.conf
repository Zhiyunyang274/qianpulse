# 黔脉 · Nginx 站点配置（certbot 已接管证书段，重装时 certbot 会自动补 443/跳转）
# 手动部署本文件后需执行: certbot --nginx -d <你的域名> --non-interactive --agree-tos --redirect -m <你的邮箱>

proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=1g inactive=30d use_temp_path=off;

server {
    server_name qianpulse.caixuntong.cn;

    # 上传体积（车载 ZIP 上传走 Streamlit）
    client_max_body_size 64m;

    # ---- OpenFreeMap 同源瓦片代理 ----
    # 浏览器只需访问本站即可加载地图底图，不再依赖浏览器直连境外瓦片站（大陆网络常不可达）。
    # sub_filter 把样式 JSON 里的绝对地址改写为本站绝对 URL（data: iframe 内相对路径无法解析，
    # 必须是绝对地址）；ipv6=off 避免走上游 IPv6（阿里云 IPv6 出网不通导致瓦片超时）。
    location /tiles/ {
        resolver 223.5.5.5 8.8.8.8 valid=300s ipv6=off;
        set $tiles_upstream https://tiles.openfreemap.org;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $tiles_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host tiles.openfreemap.org;
        # sub_filter 需要未压缩响应
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter 'https://tiles.openfreemap.org' 'https://qianpulse.caixuntong.cn/tiles';
        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid any 5m;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
